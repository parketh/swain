name: Release

on:
  push:
    branches: [main]

# Never cancel an in-progress publication: a half-run release can push a tag
# without its assets, which then blocks the version forever.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      # semantic-release runs under Node; its `prepare` step calls
      # `bun run build:release` to cross-compile and package the matrix.
      - name: Release
        run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
