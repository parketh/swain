name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Format, typecheck, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The core ripgrep tests exercise the system `rg` fallback, which the
      # runner image doesn't ship.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      # Generous per-test timeout: TUI render tests are slower on CI runners.
      - name: Run tests
        run: bun run test --timeout 20000

  verify-artifacts:
    name: Verify standalone Linux artifacts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build test artifacts
        run: bun run build:release -- --version 0.0.0-test --commit "$(git rev-parse HEAD)" --all

      - name: Verify clean containers
        run: bash packages/tui/scripts/verify-release.sh dist 0.0.0-test

      - name: Reject target mismatch
        run: bash packages/tui/scripts/verify-release.sh dist 0.0.0-test --mismatch
