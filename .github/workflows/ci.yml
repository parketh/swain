name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Format, typecheck, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun test packages/llms/test

  artifact-smoke:
    name: Smoke standalone Linux artifacts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build test artifacts
        run: bun run build:release -- --version 0.0.0-test --commit "$(git rev-parse HEAD)" --all

      - name: Smoke clean containers
        run: bash packages/tui/scripts/smoke-release.sh dist 0.0.0-test

      - name: Reject target mismatch
        run: bash packages/tui/scripts/smoke-release.sh dist 0.0.0-test --mismatch
